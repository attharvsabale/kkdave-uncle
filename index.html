<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKD Numerology - Vedic Grid</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--gold);
            margin-bottom: 25px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 70%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b8952d;
            transform: translateY(-2px);
        }

        .result-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .result-info span {
            color: var(--gold);
            font-weight: bold;
        }

        /* 3x3 Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }

        .grid-item {
            aspect-ratio: 1;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: #1a1a1a;
            border-radius: 8px;
            transition: 0.3s;
            min-height: 80px;
        }

        .highlight {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
            font-weight: bold;
        }

        .stats {
            text-align: left;
            margin-top: 20px;
            padding: 15px;
            background: #252525;
            border-radius: 8px;
        }

        .stats p {
            margin: 8px 0;
        }

        .strong-nums { color: var(--gold); font-weight: bold; }
        .missing-nums { color: #888; }

        @media (max-width: 400px) {
            .grid-item { font-size: 1.1rem; min-height: 60px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>KKD Numerology - Vedic Grid</h1>
    
    <div class="input-section">
        <input type="text" id="dobInput" placeholder="DD/MM/YYYY" maxlength="10">
        <button onclick="generateGrid()">Generate Grid</button>
    </div>

    <div id="output" style="display: none;">
        <div class="result-info">
            <div>Root (R.N.): <span id="rnVal"></span></div>
            <div>Destiny (D.N.): <span id="dnVal"></span></div>
        </div>

        <div class="grid-container" id="vedicGrid">
            <div class="grid-item" id="cell-3"></div>
            <div class="grid-item" id="cell-1"></div>
            <div class="grid-item" id="cell-9"></div>
            <div class="grid-item" id="cell-6"></div>
            <div class="grid-item" id="cell-7"></div>
            <div class="grid-item" id="cell-5"></div>
            <div class="grid-item" id="cell-2"></div>
            <div class="grid-item" id="cell-8"></div>
            <div class="grid-item" id="cell-4"></div>
        </div>

        <div class="stats">
            <p>Strong Numbers: <span id="strongList" class="strong-nums"></span></p>
            <p>Missing Numbers: <span id="missingList" class="missing-nums"></span></p>
        </div>
    </div>
</div>

<script>
    // Simple digit reducer function (Sum of digits until single digit)
    function reduceToSingle(num) {
        let sum = num.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        return sum > 9 ? reduceToSingle(sum) : sum;
    }

    function getRootNumber(dob) {
        let day = dob.split('/')[0];
        return reduceToSingle(day);
    }

    function getDestinyNumber(dob) {
        let digitsOnly = dob.replace(/\//g, '');
        let totalSum = digitsOnly.split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        return reduceToSingle(totalSum);
    }

    function generateGrid() {
        const dob = document.getElementById('dobInput').value;
        const dobRegex = /^(\d{2})\/(\d{2})\/(\d{4})$/;

        if (!dobRegex.test(dob)) {
            alert("Enter valid DOB (DD/MM/YYYY)");
            return;
        }

        // Logic Implementation
        const rn = getRootNumber(dob);
        const dn = getDestinyNumber(dob);
        const dobDigits = dob.replace(/\//g, '').split('').map(Number).filter(n => n !== 0);
        
        // Final collection of all numbers to place in grid
        const allNumbers = [...dobDigits, rn, dn];
        
        // Count frequencies
        const counts = {};
        for (let i = 1; i <= 9; i++) counts[i] = "";
        
        allNumbers.forEach(num => {
            if (num >= 1 && num <= 9) {
                counts[num] += num.toString();
            }
        });

        // Update UI
        document.getElementById('rnVal').innerText = rn;
        document.getElementById('dnVal').innerText = dn;
        
        const strongNums = [];
        const missingNums = [];

        // Grid positions mapping
        const gridOrder = [3, 1, 9, 6, 7, 5, 2, 8, 4];
        
        gridOrder.forEach(num => {
            const cell = document.getElementById(`cell-${num}`);
            const value = counts[num];
            
            cell.innerText = value;
            
            if (value.length > 0) {
                cell.classList.add('highlight');
                if (!strongNums.includes(num)) strongNums.push(num);
            } else {
                cell.classList.remove('highlight');
                missingNums.push(num);
            }
        });

        document.getElementById('strongList').innerText = strongNums.sort().join(', ');
        document.getElementById('missingList').innerText = missingNums.sort().join(', ');
        
        document.getElementById('output').style.display = 'block';
    }

    // Auto-format input to add slashes
    document.getElementById('dobInput').addEventListener('input', function (e) {
        let val = e.target.value.replace(/\D/g, '');
        if (val.length > 2 && val.length <= 4) {
            e.target.value = val.slice(0, 2) + '/' + val.slice(2);
        } else if (val.length > 4) {
            e.target.value = val.slice(0, 2) + '/' + val.slice(2, 4) + '/' + val.slice(4, 8);
        }
    });
</script>

</body>
</html>
