<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KKD Numerology – Vedic Grid</title>
<style>
body{
  font-family: Arial;
  background:#0d0d1a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}
input,button{
  padding:10px;
  margin:10px;
  font-size:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:10px;
  margin-top:20px;
}
.cell{
  border:1px solid white;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.highlight{
  background:gold;
  color:black;
}
</style>
</head>

<body>

<h2>Vedic Grid</h2>

<input type="text" id="dob" placeholder="DD/MM/YYYY"/>
<button onclick="generate()">Generate</button>

<div id="result"></div>
<div class="grid" id="grid"></div>

<script>

// state
let S = {};

// meanings
const MEANINGS = {
  1:'Leadership',2:'Partnership',3:'Creativity',4:'Stability',
  5:'Freedom',6:'Care',7:'Spiritual',8:'Power',9:'Completion'
};

// reduce to single digit
function reduce(n){
  while(n>9){
    n = n.toString().split('').reduce((a,b)=>a+Number(b),0);
  }
  return n;
}

// extract digits
function extract(dob){
  let [dd,mm,yy] = dob.split('/');

  if(yy.startsWith('19')) yy = yy.slice(2);

  let digits = (dd+mm+yy)
    .split('')
    .map(Number)
    .filter(d=>d!==0);

  return {dd,digits};
}

// root number
function getRN(dd){
  let d = Number(dd);
  if(d%10===0) return d/10;
  if(d<10) return d;
  return reduce(d);
}

// destiny number
function getDN(digits){
  let sum = digits.reduce((a,b)=>a+b,0);
  return reduce(sum);
}

// frequency
function getFreq(digits){
  let f={};
  for(let i=1;i<=9;i++) f[i]=0;
  digits.forEach(d=>f[d]++);
  return f;
}

// generate grid
function generate(){

  let dob = document.getElementById("dob").value;

  if(!dob) return alert("Enter DOB");

  let {dd,digits} = extract(dob);
  let rn = getRN(dd);
  let dn = getDN(digits);
  let freq = getFreq(digits);

  S = {rn,dn,digits};

  document.getElementById("result").innerHTML =
    `Root Number: ${rn} <br> Destiny Number: ${dn}`;

  let order = [3,1,9,6,7,5,2,8,4];
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  order.forEach(n=>{
    let div = document.createElement("div");
    div.className="cell";

    if(freq[n]>0){
      div.innerText = String(n).repeat(freq[n]);
      div.classList.add("highlight");
    }

    if(n===rn || n===dn){
      div.classList.add("highlight");
    }

    grid.appendChild(div);
  });
}

</script>

</body>
</html>
