<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKD Numerology - Vedic Grid</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #e0e0e0;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="date"] {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px;
            background-color: var(--gold);
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background-color: #f1c40f; }

        .results-section { display: none; margin-top: 20px; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .numbers-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box { text-align: center; font-size: 0.9em; }
        .info-box span { 
            display: block; 
            font-size: 26px; 
            color: var(--gold); 
            font-weight: bold;
        }

        .vedic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-radius: 5px;
            min-height: 90px;
        }

        .cell .pos-num { font-size: 10px; color: #555; margin-bottom: 5px; }
        .cell .user-nums { font-size: 20px; font-weight: bold; color: #333; letter-spacing: 2px; }

        .cell.active { border-color: var(--gold); background: #252115; }
        .cell.active .user-nums { color: var(--gold); }

        .summary { margin-top: 20px; font-size: 0.95em; border-top: 1px solid #333; padding-top: 15px; }
        .summary p { margin: 8px 0; }
        .summary strong { color: var(--gold); }
    </style>
</head>
<body>

    <div class="container">
        <h1>KKD Numerology</h1>
        <div class="subtitle">Vedic Grid (वैदिक ग्रिड)</div>
        
        <div class="input-group">
            <input type="date" id="dob">
            <button onclick="generateGrid()">Generate Grid</button>
        </div>

        <div id="results" class="results-section">
            <div class="numbers-info">
                <div class="info-box">Root (मूलांक) <span id="display-rn">-</span></div>
                <div class="info-box">Destiny (भाग्यांक) <span id="display-dn">-</span></div>
            </div>

            <div class="vedic-grid">
                <div class="cell" id="cell-3"><div class="pos-num">3</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-1"><div class="pos-num">1</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-9"><div class="pos-num">9</div><div class="user-nums"></div></div>
                
                <div class="cell" id="cell-6"><div class="pos-num">6</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-7"><div class="pos-num">7</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-5"><div class="pos-num">5</div><div class="user-nums"></div></div>
                
                <div class="cell" id="cell-2"><div class="pos-num">2</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-8"><div class="pos-num">8</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-4"><div class="pos-num">4</div><div class="user-nums"></div></div>
            </div>

            <div class="summary">
                <p><strong>Strong Numbers:</strong> <span id="strong-nos"></span></p>
                <p><strong>Missing Numbers:</strong> <span id="missing-nos"></span></p>
            </div>
        </div>
    </div>

    <script>
        function sumToSingleDigit(n) {
            let sum = Math.abs(n);
            while (sum > 9) {
                sum = sum.toString().split('').reduce((acc, d) => acc + parseInt(d), 0);
            }
            return sum;
        }

        function generateGrid() {
            const dobInput = document.getElementById('dob').value;
            if (!dobInput) { alert("कृपया सही जन्मतिथि चुनें"); return; }

            const [year, month, dayStr] = dobInput.split('-');
            const dayNum = parseInt(dayStr);
            const monthNum = parseInt(month);
            
            let gridDigits = [];

            // 1. नियम (a): DOB के सभी अंक शामिल करें (वर्ष के '19' को छोड़कर)
            dayStr.split('').forEach(d => gridDigits.push(parseInt(d)));
            month.split('').forEach(d => gridDigits.push(parseInt(d)));
            
            if (year.startsWith("19")) {
                gridDigits.push(parseInt(year[2]));
                gridDigits.push(parseInt(year[3]));
            } else {
                year.split('').forEach(d => gridDigits.push(parseInt(d)));
            }

            // 2. नियम (b): Destiny Number (DN) - सभी अंकों का कुल योग
            const allDigitsStr = dayStr + month + year;
            const totalSum = allDigitsStr.split('').reduce((a, b) => a + parseInt(b), 0);
            const dn = sumToSingleDigit(totalSum);
            gridDigits.push(dn);

            // 3. नियम (c): Root Number (RN)
            let rn;
            // यदि जन्म तारीख एकल अंक है या 10, 20, 30 है
            if (dayNum <= 9 || dayNum === 10 || dayNum === 20 || dayNum === 30) {
                rn = sumToSingleDigit(dayNum);
                gridDigits.push(rn);
            } else {
                // यदि तारीख दो अंकों में है (जैसे 12): अंक 1 और 2 अलग-अलग भरे जाएंगे + उनका योग (3) भी
                const d1 = parseInt(dayStr[0]);
                const d2 = parseInt(dayStr[1]);
                gridDigits.push(d1, d2);
                rn = sumToSingleDigit(d1 + d2);
                gridDigits.push(rn);
            }

            // 4. ग्रिड भरना और UI अपडेट करना
            let counts = {1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: ""};
            let strong = new Set();

            gridDigits.forEach(num => {
                if (num > 0 && num <= 9) {
                    counts[num] += num.toString();
                    strong.add(num);
                }
            });

            let missing = [];
            for (let i = 1; i <= 9; i++) {
                const cell = document.getElementById(`cell-${i}`);
                const display = cell.querySelector('.user-nums');
                display.innerText = counts[i];
                
                if (counts[i].length > 0) {
                    cell.classList.add('active');
                } else {
                    cell.classList.remove('active');
                    missing.push(i);
                }
            }

            // परिणाम दिखाएं
            document.getElementById('display-rn').innerText = rn;
            document.getElementById('display-dn').innerText = dn;
            document.getElementById('strong-nos').innerText = Array.from(strong).sort().join(', ');
            document.getElementById('missing-nos').innerText = missing.join(', ');
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
