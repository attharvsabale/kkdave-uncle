<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKD Numerology - Vedic Grid</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #e0e0e0;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        label { font-weight: bold; }

        input[type="date"] {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 12px;
            background-color: var(--gold);
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #f1c40f;
            transform: scale(1.02);
        }

        .results-section {
            display: none; /* Hidden until calculation */
            margin-top: 20px;
        }

        .numbers-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box { text-align: center; }
        .info-box span { 
            display: block; 
            font-size: 24px; 
            color: var(--gold); 
            font-weight: bold;
        }

        /* Vedic Grid Styling */
        .vedic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            background: #1a1a1a;
            border-radius: 5px;
            min-height: 80px;
            transition: all 0.3s ease;
            color: #555; /* Default for empty/missing */
        }

        .cell.active {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .summary {
            margin-top: 20px;
            line-height: 1.6;
        }

        .summary strong { color: var(--gold); }

        @media (max-width: 400px) {
            .container { padding: 15px; }
            .cell { font-size: 16px; min-height: 60px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KKD Numerology</h1>
        
        <div class="input-group">
            <label for="dob">Enter Date of Birth:</label>
            <input type="date" id="dob">
            <button onclick="generateGrid()">Generate Grid</button>
        </div>

        <div id="results" class="results-section">
            <div class="numbers-info">
                <div class="info-box">
                    Root No (RN)
                    <span id="display-rn">-</span>
                </div>
                <div class="info-box">
                    Destiny No (DN)
                    <span id="display-dn">-</span>
                </div>
            </div>

            <div class="vedic-grid" id="grid-container">
                <div class="cell" id="cell-3"></div>
                <div class="cell" id="cell-1"></div>
                <div class="cell" id="cell-9"></div>
                
                <div class="cell" id="cell-6"></div>
                <div class="cell" id="cell-7"></div>
                <div class="cell" id="cell-5"></div>
                
                <div class="cell" id="cell-2"></div>
                <div class="cell" id="cell-8"></div>
                <div class="cell" id="cell-4"></div>
            </div>

            <div class="summary">
                <p><strong>Strong Numbers:</strong> <span id="strong-nos"></span></p>
                <p><strong>Missing Numbers:</strong> <span id="missing-nos"></span></p>
            </div>
        </div>
    </div>

    <script>
        // Helper to reduce any number to a single digit (except 11, 22 etc, but Vedic uses 1-9)
        function reduceToSingleDigit(num) {
            let sum = num;
            while (sum > 9) {
                sum = sum.toString().split('').reduce((acc, digit) => acc + parseInt(digit), 0);
            }
            return sum;
        }

        function getRootNumber(day) {
            return reduceToSingleDigit(parseInt(day));
        }

        function getDestinyNumber(dobString) {
            // Remove non-digits
            const digits = dobString.replace(/\D/g, '');
            const sum = digits.split('').reduce((acc, d) => acc + parseInt(d), 0);
            return reduceToSingleDigit(sum);
        }

        function generateGrid() {
            const dobInput = document.getElementById('dob').value;
            
            if (!dobInput) {
                alert("Enter valid DOB");
                return;
            }

            // Parse Date components
            const dateObj = new Date(dobInput);
            const day = dateObj.getDate().toString().padStart(2, '0');
            const month = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            const year = dateObj.getFullYear().toString();
            const fullDOB = day + month + year;

            // Step 2 & 3: Calculate RN and DN
            const rn = getRootNumber(day);
            const dn = getDestinyNumber(fullDOB);

            // Step 4: Count Frequencies (Ignore 0)
            let counts = {1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: ""};
            
            // Numbers to include in the grid: All digits from DOB + RN + DN
            const allNumbers = (fullDOB + rn + dn).split('');

            allNumbers.forEach(num => {
                if (num !== '0' && counts[num] !== undefined) {
                    counts[num] += num;
                }
            });

            // Step 5 & 6: Update UI Grid
            let strongNumbers = new Set();
            let missingNumbers = [];

            for (let i = 1; i <= 9; i++) {
                const cell = document.getElementById(`cell-${i}`);
                const value = counts[i];
                
                cell.innerText = value || ""; // Show repeated digits
                
                if (value.length > 0) {
                    cell.classList.add('active');
                    strongNumbers.add(i);
                } else {
                    cell.classList.remove('active');
                    missingNumbers.push(i);
                }
            }

            // Update Labels
            document.getElementById('display-rn').innerText = rn;
            document.getElementById('display-dn').innerText = dn;
            document.getElementById('strong-nos').innerText = Array.from(strongNumbers).sort().join(', ');
            document.getElementById('missing-nos').innerText = missingNumbers.join(', ');

            // Show results
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
