<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKD Numerology - Vedic Grid</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-light: #e0e0e0;
            --border-color: #444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="date"] {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 12px;
            background-color: var(--gold);
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background-color: #f1c40f; }

        .results-section { display: none; margin-top: 20px; }

        .numbers-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box { text-align: center; font-size: 0.9em; }
        .info-box span { 
            display: block; 
            font-size: 26px; 
            color: var(--gold); 
            font-weight: bold;
        }

        .vedic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 300px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border-radius: 5px;
            min-height: 90px;
            transition: all 0.3s ease;
        }

        .cell .pos-num { font-size: 10px; color: #444; margin-bottom: 5px; }
        .cell .user-nums { font-size: 20px; font-weight: bold; color: #333; letter-spacing: 2px; }

        .cell.active { border-color: var(--gold); }
        .cell.active .user-nums { color: var(--gold); }

        .summary { margin-top: 20px; font-size: 0.95em; border-top: 1px solid #333; padding-top: 15px; }
        .summary p { margin: 8px 0; }
        .summary strong { color: var(--gold); }

        @media (max-width: 400px) {
            .cell { min-height: 70px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KKD Numerology</h1>
        <div class="subtitle">Vedic Grid Calculator</div>
        
        <div class="input-group">
            <input type="date" id="dob">
            <button onclick="generateGrid()">Generate Grid</button>
        </div>

        <div id="results" class="results-section">
            <div class="numbers-info">
                <div class="info-box">Root (R.N.) <span id="display-rn">-</span></div>
                <div class="info-box">Destiny (D.N.) <span id="display-dn">-</span></div>
            </div>

            <div class="vedic-grid">
                <div class="cell" id="cell-3"><div class="pos-num">3</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-1"><div class="pos-num">1</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-9"><div class="pos-num">9</div><div class="user-nums"></div></div>
                
                <div class="cell" id="cell-6"><div class="pos-num">6</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-7"><div class="pos-num">7</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-5"><div class="pos-num">5</div><div class="user-nums"></div></div>
                
                <div class="cell" id="cell-2"><div class="pos-num">2</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-8"><div class="pos-num">8</div><div class="user-nums"></div></div>
                <div class="cell" id="cell-4"><div class="pos-num">4</div><div class="user-nums"></div></div>
            </div>

            <div class="summary">
                <p><strong>Strong Numbers:</strong> <span id="strong-nos"></span></p>
                <p><strong>Missing Numbers:</strong> <span id="missing-nos"></span></p>
            </div>
        </div>
    </div>

    <script>
        function sumToSingleDigit(n) {
            if (n === 0) return 0;
            let sum = Math.abs(n);
            while (sum > 9) {
                sum = sum.toString().split('').reduce((acc, d) => acc + parseInt(d), 0);
            }
            return sum;
        }

        function generateGrid() {
            const dobVal = document.getElementById('dob').value;
            if (!dobVal) { alert("Enter valid DOB"); return; }

            const [year, month, day] = dobVal.split('-');
            const dayNum = parseInt(day);
            
            // 1. GRID NUMBERS ARRAY
            let gridNumbers = [];

            // (a) Add all digits except '19' from year
            // Date digits
            day.split('').forEach(d => gridNumbers.push(parseInt(d)));
            // Month digits
            month.split('').forEach(d => gridNumbers.push(parseInt(d)));
            // Year digits (Handling '19' rule)
            let yearDigits = year.split('');
            if (year.startsWith("19")) {
                gridNumbers.push(parseInt(yearDigits[2]));
                gridNumbers.push(parseInt(yearDigits[3]));
            } else {
                yearDigits.forEach(d => gridNumbers.push(parseInt(d)));
            }

            // (b) Destiny Number (D.N.) - Sum of ALL DOB digits
            const fullSum = (day + month + year).split('').reduce((a, b) => a + parseInt(b), 0);
            const dn = sumToSingleDigit(fullSum);
            gridNumbers.push(dn);

            // (c) Root Number (R.N.)
            let rn;
            if (dayNum <= 9 || dayNum === 10 || dayNum === 20 || dayNum === 30) {
                rn = sumToSingleDigit(dayNum);
                gridNumbers.push(rn);
            } else {
                // Double digit date: add individual digits AND the sum
                const d1 = parseInt(day[0]);
                const d2 = parseInt(day[1]);
                gridNumbers.push(d1, d2);
                rn = sumToSingleDigit(d1 + d2);
                gridNumbers.push(rn);
            }

            // 2. PROCESS GRID UI
            let counts = {1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: "", 8: "", 9: ""};
            let strong = new Set();
            
            gridNumbers.forEach(n => {
                if (n > 0 && n <= 9) {
                    counts[n] += n.toString();
                    strong.add(n);
                }
            });

            let missing = [];
            for (let i = 1; i <= 9; i++) {
                const cell = document.getElementById(`cell-${i}`);
                const displayArea = cell.querySelector('.user-nums');
                displayArea.innerText = counts[i];
                
                if (counts[i].length > 0) {
                    cell.classList.add('active');
                } else {
                    cell.classList.remove('active');
                    missing.push(i);
                }
            }

            // 3. UPDATE INFO
            document.getElementById('display-rn').innerText = rn;
            document.getElementById('display-dn').innerText = dn;
            document.getElementById('strong-nos').innerText = Array.from(strong).sort().join(', ');
            document.getElementById('missing-nos').innerText = missing.join(', ');
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
